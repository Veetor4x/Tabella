# Render Blueprint for the Tabella helper (relay + Postman): one web service on the FREE plan.
#
# Free instances spin down after ~15 minutes without inbound traffic and wake (about a minute) on the
# next request. The Postman's loop lives in this process, so while it sleeps nothing is published:
# a release can be delayed until something wakes the helper. On every start the Postman runs one full
# catch-up pass at once, so overdue Part B goes out within seconds of waking. For an always-on helper,
# change `plan` to `starter`.
#
# Why the repo root is the build context: helper/ imports ../shared/tabella-crypto.ts, so both
# folders must be installed.
#
# Secrets are NOT in this file. HELPER_MNEMONIC is `sync: false`: Render asks you for it in the
# dashboard and never stores it in git.
services:
  - type: web
    name: tabella-helper
    runtime: node
    plan: free
    region: virginia # closest to the testnet API (Cloudflare IAD)
    branch: claude/charming-gauss-6rpr0x # change to main once merged
    autoDeploy: true
    buildFilter:
      paths:
        - helper/**
        - shared/**
        - render.yaml
    # `npm ci` skips devDependencies when NODE_ENV=production; nothing in either folder needs them at runtime.
    buildCommand: npm ci --prefix shared && npm ci --prefix helper
    startCommand: npm start --prefix helper
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22" # the helper uses node --env-file-if-exists (22.9+)
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render adds one X-Forwarded-For entry: that one is the real client
      - key: REGISTRY_ADDRESS
        value: "0xC0808aF18e2283dFE4d026315a462349561fFd1c" # public contract address on qorechain-diana
      - key: CORS_ORIGINS
        value: "https://tabella-veetor4x.vercel.app,https://tabella-five.vercel.app,http://localhost:5173"
      # --- the only secret: type it into the Render dashboard yourself
      - key: HELPER_MNEMONIC
        sync: false
